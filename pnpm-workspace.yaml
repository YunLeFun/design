ignoreWorkspaceRootCheck: true

minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@yunlefun/icons@0.3.1'

trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
  - undici-types@6.21.0

strictPeerDependencies: false
shamefullyHoist: true
shellEmulator: true
sideEffectsCache: false

packages:
  - packages/*

overrides:
  '@babel/core@<7.29.6': 7.29.6
  '@babel/helpers@<7.26.10': 7.29.2
  # cssnano 9 dropped staged-publish approvals; retain the latest approved release.
  '@nuxt/vite-builder>cssnano': 8.0.10
  # VitePress 1 inlines MarkdownIt 14.1 types in its public declarations.
  '@types/markdown-it': 14.1.2
  baseline-browser-mapping: 2.11.15
  brace-expansion@1: 1.1.18
  brace-expansion@2: 2.1.7
  brace-expansion@4: 5.0.12
  brace-expansion@5: 5.0.12
  browserslist: 4.28.7
  devalue: 5.9.3
  electron-to-chromium: 1.5.392
  eslint-plugin-jsdoc: 63.0.13
  fast-uri: 3.1.8
  flatted@<3.4.2: 3.4.2
  glob@10: 10.5.0
  hono: 4.13.7
  ip-address@10: 10.7.1
  js-yaml@3: 3.15.2
  katex@<0.18.2: 0.19.0
  lodash@4: 4.18.0
  mdast-util-to-hast@13: 13.2.1
  minimatch@3: 3.1.4
  minimatch@5: 5.1.8
  minimatch@9: 9.0.7
  nanoid@3: 3.3.18
  nostics: 1.1.4
  picomatch@2: 2.3.2
  picomatch@4: 4.0.4
  postcss@8: 8.5.30
  qs: 6.16.0
  rollup@4: 4.59.0
  stylus: 0.64.0
  svgo@4: 4.1.0
  tar@7: 7.5.22
  tinypool@<2.1.2: 2.2.0
  undici@8: 8.10.2
  vitepress>@vitejs/plugin-vue: 6.0.10
  vitepress>vite: 7.3.6
  yaml@2: 2.9.1

patchedDependencies:
  braces@3.0.3: patches/braces@3.0.3.patch
  node-forge@1.4.0: patches/node-forge@1.4.0.patch
  sprintf-js@1.0.3: patches/sprintf-js@1.0.3.patch

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  vue-demi: true
