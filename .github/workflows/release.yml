name: Release

on:
  push:
    tags:
      - 'release-*'

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm exec vitest run
      - run: pnpm run audit
      - run: pnpm run ui:verify
      - run: pnpm run build:vue
      - run: pnpm run nuxt:verify
      - run: pnpm run registry:verify
      - run: pnpm run docs:build

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/

      - run: npm install --global npm@11.16.0
      - run: pnpm install --frozen-lockfile
      - run: npm run ci:publish
